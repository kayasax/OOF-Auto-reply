name: Release clean skill bundle

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          grep -Fq "## [$(cat VERSION)] - " CHANGELOG.md

      - name: Build clean skill archive
        shell: bash
        run: |
          mkdir -p release/OOF-auto-reply
          cp -R .gitignore CHANGELOG.md CONFIG-REFERENCE.md HOWTO.md LICENSE README.md SKILL.md VERSION docs references scripts release/OOF-auto-reply/
          test ! -e release/OOF-auto-reply/.git
          (cd release && zip -r ../OOF-auto-reply-skill.zip OOF-auto-reply)

      - name: Verify built archive
        shell: bash
        run: |
          mkdir audit
          unzip -q OOF-auto-reply-skill.zip -d audit
          test "$(cat audit/OOF-auto-reply/VERSION)" = "${GITHUB_REF_NAME#v}"
          node audit/OOF-auto-reply/scripts/compute-period.cjs --self-test
          node audit/OOF-auto-reply/scripts/config-status.cjs --self-test
          node audit/OOF-auto-reply/scripts/render-automation.cjs --self-test
          node audit/OOF-auto-reply/scripts/render-messages.cjs --self-test
          node audit/OOF-auto-reply/scripts/validate-contracts.cjs

      - name: Verify archive privacy
        shell: bash
        run: |
          unzip -l OOF-auto-reply-skill.zip
          ! unzip -l OOF-auto-reply-skill.zip | grep -E '(^|/)\.git(/|$)|config\.json|artifacts/|screenshots/|dev-test'

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: OOF-auto-reply-skill.zip
